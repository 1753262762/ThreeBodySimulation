openapi: 3.0.3
info:
  title: Three Body Lab Backend API
  description: |
    本地 N 体模拟"参数实验室"后端契约。所有数值使用 SI 单位：质量 kg、长度 m、速度 m/s、时间 s。
    单位换算（太阳质量、AU、km/s）由前端展示层负责，接口不接受非 SI 数值。
  version: 1.1.0
servers:
  - url: http://127.0.0.1:8721/api/v1
    description: 本地服务
tags:
  - name: presets
  - name: configs
  - name: experiments
  - name: queue
  - name: exports
  - name: history
  - name: replay
paths:
  /presets:
    get:
      tags: [presets]
      summary: 获取内置 A-J 预设配置
      operationId: listPresets
      responses:
        '200':
          description: 预设列表
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Preset'
  /configs/validate:
    post:
      tags: [configs]
      summary: 校验模拟配置
      description: 始终返回 200；配置是否合法由 valid 字段与 issues 列表表示。
      operationId: validateConfig
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SimulationConfig'
      responses:
        '200':
          description: 校验结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationResult'
        '400':
          $ref: '#/components/responses/BadRequest'
  /experiments:
    get:
      tags: [experiments]
      summary: 按队列顺序列出实验
      operationId: listExperiments
      parameters:
        - name: status
          in: query
          required: false
          description: 可选状态过滤，多个值使用逗号分隔
          schema:
            type: string
      responses:
        '200':
          description: 实验摘要列表
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ExperimentSummary'
    post:
      tags: [experiments]
      summary: 创建实验并入队，或复用同配置实验
      operationId: createExperiment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExperimentCreateRequest'
      responses:
        '200':
          description: 已存在同配置实验，返回复用的实验记录
          headers:
            Location:
              description: 复用的实验资源地址
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Experiment'
        '201':
          description: 已创建
          headers:
            Location:
              description: 新实验资源地址
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Experiment'
        '400':
          $ref: '#/components/responses/BadRequest'
  /experiments/{id}:
    parameters:
      - $ref: '#/components/parameters/ExperimentId'
    get:
      tags: [experiments]
      summary: 获取实验完整状态
      description: 客户端 WebSocket 重连后先调用本接口获取全量状态，再接收序列号更大的增量消息。
      operationId: getExperiment
      responses:
        '200':
          description: 实验详情
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Experiment'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [experiments]
      summary: 编辑实验，仅 QUEUED 状态允许
      operationId: updateExperiment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExperimentCreateRequest'
      responses:
        '200':
          description: 已更新
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Experiment'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    delete:
      tags: [experiments]
      summary: 删除实验及其结果文件
      description: RUNNING 实验必须先取消；删除会返回释放的占用空间。
      operationId: deleteExperiment
      responses:
        '200':
          description: 已删除
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteResult'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /experiments/{id}/actions:
    parameters:
      - $ref: '#/components/parameters/ExperimentId'
    post:
      tags: [experiments]
      summary: 执行实验控制动作
      operationId: submitExperimentAction
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExperimentActionRequest'
      responses:
        '200':
          description: 动作已接受，返回最新实验状态
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Experiment'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /queue:
    patch:
      tags: [queue]
      summary: 提交完整有序实验 ID 列表以重排队列
      description: 必须包含且只包含当前全部实验 ID；RUNNING 实验的相对位置不得改变。
      operationId: reorderQueue
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QueueReorderRequest'
      responses:
        '200':
          description: 重排后的实验摘要列表
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ExperimentSummary'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
  /experiments/{id}/exports/config:
    parameters:
      - $ref: '#/components/parameters/ExperimentId'
    get:
      tags: [exports]
      summary: 下载配置 JSON
      operationId: exportConfig
      responses:
        '200':
          description: 配置文件
          headers:
            Content-Disposition:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimulationConfig'
        '404':
          $ref: '#/components/responses/NotFound'
  /experiments/{id}/exports/trajectory:
    parameters:
      - $ref: '#/components/parameters/ExperimentId'
    get:
      tags: [exports]
      summary: 下载分层采样轨迹 CSV
      description: |
        长表格式，列为 step,timeSeconds,bodyId,bodyName,x,y,z,vx,vy,vz。
        实际采样步长通过响应头 X-Sample-Stride 返回，同时也出现在实验详情的 trajectory.sampleStride。
      operationId: exportTrajectory
      responses:
        '200':
          description: CSV 文件
          headers:
            X-Sample-Stride:
              description: 相邻采样点之间的模拟步数
              schema:
                type: integer
                format: int64
            X-Sample-Count:
              schema:
                type: integer
                format: int64
            Content-Disposition:
              schema:
                type: string
          content:
            text/csv:
              schema:
                type: string
        '404':
          $ref: '#/components/responses/NotFound'
  /experiments/{id}/report-data:
    parameters:
      - $ref: '#/components/parameters/ExperimentId'
    get:
      tags: [exports]
      summary: 获取报告页所需的聚合数据
      operationId: getReportData
      responses:
        '200':
          description: 报告数据
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportData'
        '404':
          $ref: '#/components/responses/NotFound'
  /experiments/{id}/history:
    parameters:
      - $ref: '#/components/parameters/ExperimentId'
    get:
      tags: [history]
      summary: 查询已归档轨迹范围
      description: |
        返回闭区间 [fromStep, toStep] 内已持久化的归档点，按 step 升序。
        超过 maxPoints 时均匀抽样并保留首尾点。运行中不强制 flush，currentState 独立返回，
        归档点可能落后于权威状态（最终一致性）。参数非法或 toStep 超过当前权威步返回 400。
      operationId: getExperimentHistory
      parameters:
        - name: fromStep
          in: query
          required: false
          description: 起始步，默认 0，必须 >= 0
          schema:
            type: integer
            format: int64
            minimum: 0
        - name: toStep
          in: query
          required: false
          description: 结束步，默认当前可用最大步，必须 >= fromStep
          schema:
            type: integer
            format: int64
            minimum: 0
        - name: maxPoints
          in: query
          required: false
          description: 返回点数上限，默认 1000，范围 2～2000
          schema:
            type: integer
            format: int32
            minimum: 2
            maximum: 2000
      responses:
        '200':
          description: 历史轨迹范围
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HistoryResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
  /experiments/{id}/replay-jobs:
    parameters:
      - $ref: '#/components/parameters/ExperimentId'
    post:
      tags: [replay]
      summary: 创建精确回放任务
      description: |
        targetStep 必须在 [0, currentStep] 内。目标等于当前权威状态或精确归档点立即返回
        200/COMPLETED；需要重算时返回 202/QUEUED。待处理任务达到 8 个时返回 429。
      operationId: createReplayJob
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReplayJobCreateRequest'
      responses:
        '200':
          description: 精确命中，任务已完成
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReplayJob'
        '202':
          description: 需要重算，任务已入队
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReplayJob'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          description: 待处理回放任务已达上限
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /experiments/{id}/replay-jobs/{jobId}:
    parameters:
      - $ref: '#/components/parameters/ExperimentId'
      - name: jobId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [replay]
      summary: 查询回放任务进度与结果
      operationId: getReplayJob
      responses:
        '200':
          description: 回放任务
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReplayJob'
        '404':
          description: 任务不存在或已过期
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
    delete:
      tags: [replay]
      summary: 删除回放任务
      description: 运行中任务进入 CANCELLED，已终态任务保持原终态。
      operationId: deleteReplayJob
      responses:
        '204':
          description: 已删除
        '404':
          description: 任务不存在或已过期
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
components:
  parameters:
    ExperimentId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    BadRequest:
      description: 请求非法
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    NotFound:
      description: 资源不存在
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Conflict:
      description: 状态冲突
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
  schemas:
    Vector3:
      type: object
      required: [x, y, z]
      properties:
        x:
          type: number
          format: double
        y:
          type: number
          format: double
        z:
          type: number
          format: double
    BodySpec:
      type: object
      required: [name, massKg, position, velocity]
      properties:
        id:
          type: string
          format: uuid
          description: 创建时可为空，由服务端生成
        name:
          type: string
          minLength: 1
          maxLength: 40
        color:
          type: string
          description: 十六进制颜色，形如 #RRGGBB
          pattern: '^#[0-9a-fA-F]{6}$'
        massKg:
          type: number
          format: double
          exclusiveMinimum: true
          minimum: 0
        position:
          $ref: '#/components/schemas/Vector3'
        velocity:
          $ref: '#/components/schemas/Vector3'
    SimulationConfig:
      type: object
      required: [bodies, timeStepSeconds, gravitationalConstant, softeningLengthMeters]
      description: maxSteps 与 targetSimulationTimeSeconds 至少提供一个作为结束条件。
      properties:
        name:
          type: string
          maxLength: 80
        bodies:
          type: array
          minItems: 2
          maxItems: 100
          items:
            $ref: '#/components/schemas/BodySpec'
        timeStepSeconds:
          type: number
          format: double
          exclusiveMinimum: true
          minimum: 0
        gravitationalConstant:
          type: number
          format: double
          exclusiveMinimum: true
          minimum: 0
        softeningLengthMeters:
          type: number
          format: double
          minimum: 0
          description: 软化长度 epsilon，加速度使用 a = G*m*r/(r^2+epsilon^2)^(3/2)
        maxSteps:
          type: integer
          format: int64
          nullable: true
          minimum: 1
        targetSimulationTimeSeconds:
          type: number
          format: double
          nullable: true
          exclusiveMinimum: true
          minimum: 0
    Preset:
      type: object
      required: [key, name, description, config]
      properties:
        key:
          type: string
          enum: [A, B, C, D, E, F, G, H, I, J]
        name:
          type: string
        description:
          type: string
        config:
          $ref: '#/components/schemas/SimulationConfig'
    ValidationIssue:
      type: object
      required: [field, code, message, severity]
      properties:
        field:
          type: string
          description: JSON 指针风格路径，例如 bodies[2].massKg
        code:
          type: string
          enum:
            - BODY_COUNT_OUT_OF_RANGE
            - DUPLICATE_BODY_ID
            - MISSING_BODY_NAME
            - INVALID_COLOR
            - INVALID_MASS
            - NON_FINITE_VALUE
            - COINCIDENT_BODIES
            - INVALID_TIME_STEP
            - INVALID_GRAVITATIONAL_CONSTANT
            - INVALID_SOFTENING_LENGTH
            - MISSING_END_CONDITION
            - MAX_STEPS_OUT_OF_RANGE
            - TARGET_TIME_OUT_OF_RANGE
            - TIME_STEP_TOO_LARGE
            - INITIAL_DISTANCE_TOO_SMALL
            - INITIAL_SPEED_HIGH
            - SOFTENING_TOO_SMALL
            - SOFTENING_TOO_LARGE
        message:
          type: string
        severity:
          type: string
          enum: [ERROR, WARNING]
        riskLevel:
          type: string
          nullable: true
          enum: [CAUTION, HIGH]
          description: 仅 WARNING 填写；ERROR 为 null
        guidance:
          allOf:
            - $ref: '#/components/schemas/ValidationGuidance'
          nullable: true
          description: 风险的结构化解释；ERROR 或无建议时为 null
    GuidanceEvidence:
      type: object
      required: [code, value, bodyIds]
      properties:
        code: { type: string }
        value: { type: number, format: double }
        referenceValue: { type: number, format: double, nullable: true }
        ratio: { type: number, format: double, nullable: true }
        bodyIds:
          type: array
          items: { type: string }
    GuidanceConfigPatch:
      type: object
      properties:
        timeStepSeconds: { type: number, format: double, nullable: true }
        maxSteps: { type: integer, format: int64, nullable: true }
    GuidanceAction:
      type: object
      required: [code, mode, label, rationale, tradeoff]
      properties:
        code: { type: string }
        mode:
          type: string
          enum: [APPLY_PATCH, MANUAL_REVIEW]
        label: { type: string }
        rationale: { type: string }
        tradeoff: { type: string }
        configPatch:
          allOf:
            - $ref: '#/components/schemas/GuidanceConfigPatch'
          nullable: true
        adjustmentPolicy:
          type: string
          nullable: true
          enum: [PRESERVE_SIMULATION_DURATION]
    ValidationGuidance:
      type: object
      required: [observation, impact, evidence, primaryAction, alternatives]
      properties:
        observation: { type: string }
        impact: { type: string }
        evidence:
          type: array
          items: { $ref: '#/components/schemas/GuidanceEvidence' }
        primaryAction: { $ref: '#/components/schemas/GuidanceAction' }
        alternatives:
          type: array
          items: { $ref: '#/components/schemas/GuidanceAction' }
    ConfigSummary:
      type: object
      required: [initialMinimumPairBodyIds]
      properties:
        estimatedSteps: { type: integer, format: int64, nullable: true }
        estimatedSimulationTimeSeconds: { type: number, format: double, nullable: true }
        limitingEndCondition:
          type: string
          nullable: true
          enum: [MAX_STEPS, TARGET_TIME, BOTH]
        initialMinimumPairDistanceMeters: { type: number, format: double, nullable: true }
        initialMinimumPairBodyIds:
          type: array
          items: { type: string }
        softeningToInitialDistanceRatio: { type: number, format: double, nullable: true }
    ValidationResult:
      type: object
      required: [valid, issues]
      properties:
        valid:
          type: boolean
          description: 不存在 ERROR 级问题时为 true
        issues:
          type: array
          items:
            $ref: '#/components/schemas/ValidationIssue'
        normalizedConfig:
          allOf:
            - $ref: '#/components/schemas/SimulationConfig'
          nullable: true
          description: valid 为 true 时返回补齐 ID 与颜色后的配置
        estimatedSteps:
          type: integer
          format: int64
          nullable: true
        configSummary:
          allOf:
            - $ref: '#/components/schemas/ConfigSummary'
          nullable: true
    ExperimentStatus:
      type: string
      enum: [QUEUED, RUNNING, PAUSED, COMPLETED, CANCELLED, FAILED]
    EndReason:
      type: string
      nullable: true
      enum: [MAX_STEPS, TARGET_TIME, CANCELLED, ERROR]
    ExperimentCreateRequest:
      type: object
      required: [config]
      properties:
        name:
          type: string
          maxLength: 80
        config:
          $ref: '#/components/schemas/SimulationConfig'
        retryContext:
          allOf:
            - $ref: '#/components/schemas/ExperimentRetryContext'
          nullable: true
    ExperimentRetryContext:
      type: object
      required: [sourceExperimentId, recommendationCode, strategy]
      properties:
        sourceExperimentId:
          type: string
          format: uuid
        recommendationCode:
          type: string
        strategy:
          type: string
          enum: [PRESERVE_SIMULATION_DURATION, PRESERVE_STEP_COUNT]
    ExperimentLineage:
      type: object
      required:
        - sourceExperimentId
        - sourceExperimentName
        - rootExperimentId
        - retryDepth
        - recommendationCode
        - strategy
        - changedFields
      properties:
        sourceExperimentId: { type: string, format: uuid }
        sourceExperimentName: { type: string }
        rootExperimentId: { type: string, format: uuid }
        retryDepth: { type: integer, format: int32, minimum: 1 }
        recommendationCode: { type: string }
        strategy:
          type: string
          enum: [PRESERVE_SIMULATION_DURATION, PRESERVE_STEP_COUNT]
        beforeTimeStepSeconds: { type: number, format: double, nullable: true }
        afterTimeStepSeconds: { type: number, format: double, nullable: true }
        beforeMaxSteps: { type: integer, format: int64, nullable: true }
        afterMaxSteps: { type: integer, format: int64, nullable: true }
        beforeTargetSimulationTimeSeconds: { type: number, format: double, nullable: true }
        afterTargetSimulationTimeSeconds: { type: number, format: double, nullable: true }
        beforeEstimatedSimulationTimeSeconds: { type: number, format: double, nullable: true }
        afterEstimatedSimulationTimeSeconds: { type: number, format: double, nullable: true }
        beforeEstimatedSteps: { type: integer, format: int64, nullable: true }
        afterEstimatedSteps: { type: integer, format: int64, nullable: true }
        changedFields:
          type: array
          items: { type: string }
        sourceHealthStatus:
          allOf:
            - $ref: '#/components/schemas/SimulationHealthStatus'
          nullable: true
    Progress:
      type: object
      required: [step, simulationTimeSeconds]
      properties:
        step:
          type: integer
          format: int64
        simulationTimeSeconds:
          type: number
          format: double
        maxSteps:
          type: integer
          format: int64
          nullable: true
        targetSimulationTimeSeconds:
          type: number
          format: double
          nullable: true
        completionRatio:
          type: number
          format: double
          nullable: true
          minimum: 0
          maximum: 1
        stepsPerSecond:
          type: number
          format: double
          nullable: true
        estimatedRemainingSteps:
          type: integer
          format: int64
          nullable: true
    BodyState:
      type: object
      required: [id, position, velocity]
      properties:
        id:
          type: string
          format: uuid
        position:
          $ref: '#/components/schemas/Vector3'
        velocity:
          $ref: '#/components/schemas/Vector3'
    SimulationState:
      type: object
      required: [step, simulationTimeSeconds, bodies]
      properties:
        step:
          type: integer
          format: int64
        simulationTimeSeconds:
          type: number
          format: double
        bodies:
          type: array
          items:
            $ref: '#/components/schemas/BodyState'
    Metrics:
      type: object
      required:
        - kineticEnergyJoules
        - potentialEnergyJoules
        - totalEnergyJoules
        - initialTotalEnergyJoules
        - relativeEnergyDrift
        - angularMomentum
        - angularMomentumMagnitude
        - linearMomentum
        - linearMomentumMagnitude
        - minimumPairDistanceMeters
      properties:
        kineticEnergyJoules:
          type: number
          format: double
        potentialEnergyJoules:
          type: number
          format: double
        totalEnergyJoules:
          type: number
          format: double
        initialTotalEnergyJoules:
          type: number
          format: double
        relativeEnergyDrift:
          type: number
          format: double
          description: (E - E0) / |E0|，E0 为 0 时返回 E 的绝对漂移
        angularMomentum:
          $ref: '#/components/schemas/Vector3'
        angularMomentumMagnitude:
          type: number
          format: double
        linearMomentum:
          $ref: '#/components/schemas/Vector3'
        linearMomentumMagnitude:
          type: number
          format: double
        minimumPairDistanceMeters:
          type: number
          format: double
          description: 当前步的最近两体距离
        minimumPairBodyIds:
          type: array
          nullable: true
          items:
            type: string
        allTimeMinimumPairDistanceMeters:
          type: number
          format: double
          nullable: true
        allTimeMinimumPairDistanceStep:
          type: integer
          format: int64
          nullable: true
        stepsPerSecond:
          type: number
          format: double
          nullable: true
        elapsedWallClockSeconds:
          type: number
          format: double
          nullable: true
    EventPhase:
      type: string
      enum: [ENTER, UPDATE, FINAL]
      description: 近遇生命周期阶段；诊断事件固定为 FINAL
    DiagnosticSeverity:
      type: string
      enum: [NOTICE, WARNING, CRITICAL]
    DiagnosticCauseCategory:
      type: string
      enum:
        - PHYSICAL_PHENOMENON
        - PARAMETER_RISK
        - NUMERICAL_ERROR
        - MIXED
    DiagnosticEvidence:
      type: object
      description: 诊断证据，字段均可空，只填写本次诊断相关的证据项。
      properties:
        timeStepSeconds:
          type: number
          format: double
          nullable: true
        softeningLengthMeters:
          type: number
          format: double
          nullable: true
        normalizedEnergyError:
          type: number
          format: double
          nullable: true
        relativeEnergyDrift:
          type: number
          format: double
          nullable: true
        minimumPairDistanceMeters:
          type: number
          format: double
          nullable: true
        speedRatioToEscape:
          type: number
          format: double
          nullable: true
        directionChangeDegrees:
          type: number
          format: double
          nullable: true
        rmsRadiusRatio:
          type: number
          format: double
          nullable: true
        outwardBodyFraction:
          type: number
          format: double
          nullable: true
        lastStableStep:
          type: integer
          format: int64
          nullable: true
        bodyIds:
          type: array
          nullable: true
          items:
            type: string
    Diagnostic:
      type: object
      required: [code, severity, causeCategory, summary, likelyCauses, evidence, recommendations]
      properties:
        code:
          type: string
          enum:
            - ENERGY_DRIFT
            - POSSIBLE_ESCAPE
            - SUDDEN_DEFLECTION
            - RAPID_DISASSEMBLY
            - NUMERICAL_INSTABILITY
        severity:
          $ref: '#/components/schemas/DiagnosticSeverity'
        causeCategory:
          $ref: '#/components/schemas/DiagnosticCauseCategory'
        summary:
          type: string
        likelyCauses:
          type: array
          items:
            type: string
        evidence:
          $ref: '#/components/schemas/DiagnosticEvidence'
        recommendations:
          type: array
          items:
            type: string
    SimulationEvent:
      type: object
      required: [sequence, type, step, simulationTimeSeconds, timestamp, message]
      description: |
        逻辑事件。sequence 是逻辑事件创建顺序，创建后不变；同一 eventId 的 UPDATE/FINAL 不重新分配该字段。
        eventId 是稳定事件标识，新事件必填；旧 1.0 事件可为空，前端以 sequence 作为只读兼容键。
        NUMERICAL_WARNING 为读取兼容保留枚举值，生产端不再新发，由 DIAGNOSTIC 取代。
      properties:
        sequence:
          type: integer
          format: int64
          description: 逻辑事件创建顺序，创建后不变
        eventId:
          type: string
          format: uuid
          nullable: true
        type:
          type: string
          enum: [NEAR_ENCOUNTER, STATUS_CHANGE, DIAGNOSTIC, NUMERICAL_WARNING, ERROR]
        phase:
          $ref: '#/components/schemas/EventPhase'
          nullable: true
        step:
          type: integer
          format: int64
          description: 当前修订对应的步
        simulationTimeSeconds:
          type: number
          format: double
        timestamp:
          type: string
          format: date-time
        message:
          type: string
        bodyIds:
          type: array
          nullable: true
          items:
            type: string
        distanceMeters:
          type: number
          format: double
          nullable: true
          description: 兼容字段，优先等于 closestDistanceMeters
        thresholdMeters:
          type: number
          format: double
          nullable: true
        triggerDistanceMeters:
          type: number
          format: double
          nullable: true
        closestDistanceMeters:
          type: number
          format: double
          nullable: true
        closestStep:
          type: integer
          format: int64
          nullable: true
        closestSimulationTimeSeconds:
          type: number
          format: double
          nullable: true
        midpointPosition:
          $ref: '#/components/schemas/Vector3'
          nullable: true
        diagnostic:
          $ref: '#/components/schemas/Diagnostic'
          nullable: true
    TrajectoryInfo:
      type: object
      required: [sampleStride, sampleCount, pointLimit, liveWindowSize]
      properties:
        sampleStride:
          type: integer
          format: int64
          description: 归档采样的当前步长，达到上限后按倍数增长
        sampleCount:
          type: integer
          format: int64
        pointLimit:
          type: integer
          format: int64
          description: 归档采样点上限，固定为 50000
        liveWindowSize:
          type: integer
          format: int32
          description: 实时画布每个天体保留的最近点数，固定为 8000
    SimulationHealthStatus:
      type: string
      enum: [GOOD, WARNING, POOR, FAILED]
    DriftTrend:
      type: string
      enum: [STABLE, SLOWLY_INCREASING, RAPIDLY_INCREASING]
    HealthReasonSeverity:
      type: string
      enum: [INFO, WARNING, ERROR]
    HealthThresholds:
      type: object
      required: [energyWarning, energyPoor, angularMomentumWarning, angularMomentumPoor]
      properties:
        energyWarning: { type: number, format: double, example: 0.001 }
        energyPoor: { type: number, format: double, example: 0.01 }
        angularMomentumWarning: { type: number, format: double, example: 0.001 }
        angularMomentumPoor: { type: number, format: double, example: 0.01 }
    HealthReason:
      type: object
      required: [code, severity, message]
      properties:
        code:
          type: string
          enum: [CONSERVATION_WITHIN_TOLERANCE, ENERGY_DRIFT_ELEVATED, ENERGY_DRIFT_HIGH, ANGULAR_MOMENTUM_DRIFT_ELEVATED, ANGULAR_MOMENTUM_DRIFT_HIGH, CLOSE_ENCOUNTER_NEAR_DRIFT, SOFTENING_SCALE_APPROACHED, NON_FINITE_STATE, NON_FINITE_METRICS]
        severity:
          $ref: '#/components/schemas/HealthReasonSeverity'
        metric:
          type: string
          nullable: true
        message:
          type: string
    HealthConfigPatch:
      type: object
      properties:
        timeStepSeconds:
          type: number
          format: double
          nullable: true
    HealthRecommendation:
      type: object
      required: [code, action, message, configPatch]
      properties:
        code:
          type: string
          enum: [REDUCE_TIME_STEP]
        action:
          type: string
          enum: [CLONE_AND_RETRY]
        message:
          type: string
        configPatch:
          $ref: '#/components/schemas/HealthConfigPatch'
        rationale:
          type: string
          nullable: true
        tradeoff:
          type: string
          nullable: true
        verification:
          type: string
          nullable: true
    HealthCloseEncounter:
      type: object
      required: [eventId, bodyIds, distanceMeters, step, simulationTimeSeconds]
      properties:
        eventId: { type: string }
        bodyIds:
          type: array
          items: { type: string }
        distanceMeters: { type: number, format: double }
        step: { type: integer, format: int64 }
        simulationTimeSeconds: { type: number, format: double }
    HealthFailure:
      type: object
      required: [code, step, simulationTimeSeconds, message]
      properties:
        code:
          type: string
          enum: [NON_FINITE_STATE, NON_FINITE_METRICS]
        bodyId: { type: string, nullable: true }
        field: { type: string, nullable: true }
        step: { type: integer, format: int64 }
        simulationTimeSeconds: { type: number, format: double }
        value: { type: string, nullable: true }
        message: { type: string }
    SimulationHealthMetrics:
      type: object
      required: [currentEnergyDrift, peakEnergyDrift, peakEnergyDriftStep, peakEnergyDriftSimulationTimeSeconds, energyTrend, angularMomentumTrend, closeEncounterCount]
      properties:
        currentEnergyDrift: { type: number, format: double }
        peakEnergyDrift: { type: number, format: double }
        peakEnergyDriftStep: { type: integer, format: int64 }
        peakEnergyDriftSimulationTimeSeconds: { type: number, format: double }
        currentAngularMomentumDrift: { type: number, format: double, nullable: true }
        peakAngularMomentumDrift: { type: number, format: double, nullable: true }
        peakAngularMomentumDriftStep: { type: integer, format: int64, nullable: true }
        peakAngularMomentumDriftSimulationTimeSeconds: { type: number, format: double, nullable: true }
        energyTrend: { $ref: '#/components/schemas/DriftTrend' }
        angularMomentumTrend: { $ref: '#/components/schemas/DriftTrend' }
        closestApproachMeters: { type: number, format: double, nullable: true }
        closeEncounterCount: { type: integer, format: int64 }
        latestCloseEncounter:
          allOf:
            - $ref: '#/components/schemas/HealthCloseEncounter'
          nullable: true
    SimulationHealthReport:
      type: object
      required: [status, metrics, thresholds, reasons, recommendations, analyzedStep, analyzedSimulationTimeSeconds, sampleStride, sampleCount]
      properties:
        status: { $ref: '#/components/schemas/SimulationHealthStatus' }
        metrics: { $ref: '#/components/schemas/SimulationHealthMetrics' }
        thresholds: { $ref: '#/components/schemas/HealthThresholds' }
        reasons:
          type: array
          items: { $ref: '#/components/schemas/HealthReason' }
        recommendations:
          type: array
          items: { $ref: '#/components/schemas/HealthRecommendation' }
        failure:
          allOf:
            - $ref: '#/components/schemas/HealthFailure'
          nullable: true
        analyzedStep: { type: integer, format: int64 }
        analyzedSimulationTimeSeconds: { type: number, format: double }
        sampleStride: { type: integer, format: int64, minimum: 1 }
        sampleCount: { type: integer, format: int64, minimum: 0 }
    ExperimentSummary:
      type: object
      required: [id, name, status, queuePosition, createdAt, updatedAt, bodyCount, progress]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        status:
          $ref: '#/components/schemas/ExperimentStatus'
        queuePosition:
          type: integer
          format: int32
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        startedAt:
          type: string
          format: date-time
          nullable: true
        completedAt:
          type: string
          format: date-time
          nullable: true
        bodyCount:
          type: integer
          format: int32
        progress:
          $ref: '#/components/schemas/Progress'
        endReason:
          $ref: '#/components/schemas/EndReason'
        storageBytes:
          type: integer
          format: int64
        errorCode:
          type: string
          nullable: true
        healthStatus:
          allOf:
            - $ref: '#/components/schemas/SimulationHealthStatus'
          nullable: true
        lineage:
          allOf:
            - $ref: '#/components/schemas/ExperimentLineage'
          nullable: true
    Experiment:
      allOf:
        - $ref: '#/components/schemas/ExperimentSummary'
        - type: object
          required: [config, trajectory, events]
          properties:
            config:
              $ref: '#/components/schemas/SimulationConfig'
            state:
              allOf:
                - $ref: '#/components/schemas/SimulationState'
              nullable: true
            metrics:
              allOf:
                - $ref: '#/components/schemas/Metrics'
              nullable: true
            healthReport:
              allOf:
                - $ref: '#/components/schemas/SimulationHealthReport'
              nullable: true
            trajectory:
              $ref: '#/components/schemas/TrajectoryInfo'
            events:
              type: array
              items:
                $ref: '#/components/schemas/SimulationEvent'
            lastSequence:
              type: integer
              format: int64
              description: 已发布的最大 WebSocket 序列号，重连后据此丢弃旧消息
            errorMessage:
              type: string
              nullable: true
    ExperimentActionRequest:
      type: object
      required: [action]
      properties:
        action:
          type: string
          enum: [PAUSE, RESUME, STEP, RESTART, CANCEL]
        config:
          allOf:
            - $ref: '#/components/schemas/SimulationConfig'
          nullable: true
          description: 仅 RESTART 可携带新配置；其他动作必须为 null
    QueueReorderRequest:
      type: object
      required: [experimentIds]
      properties:
        experimentIds:
          type: array
          items:
            type: string
            format: uuid
    DeleteResult:
      type: object
      required: [id, freedBytes]
      properties:
        id:
          type: string
          format: uuid
        freedBytes:
          type: integer
          format: int64
    ReportSamplePoint:
      type: object
      required: [step, simulationTimeSeconds, bodies]
      properties:
        step:
          type: integer
          format: int64
        simulationTimeSeconds:
          type: number
          format: double
        bodies:
          type: array
          items:
            $ref: '#/components/schemas/BodyState'
        totalEnergyJoules:
          type: number
          format: double
          nullable: true
        relativeEnergyDrift:
          type: number
          format: double
          nullable: true
        angularMomentumMagnitude:
          type: number
          format: double
          nullable: true
        minimumPairDistanceMeters:
          type: number
          format: double
          nullable: true
    ReportData:
      type: object
      required: [experiment, unitSystem, sampleStride, samples, generatedAt]
      properties:
        experiment:
          $ref: '#/components/schemas/Experiment'
        unitSystem:
          type: string
          enum: [SI]
        sampleStride:
          type: integer
          format: int64
        samples:
          type: array
          items:
            $ref: '#/components/schemas/ReportSamplePoint'
        generatedAt:
          type: string
          format: date-time
    HistoryResponse:
      type: object
      required: [points, archiveSampleStride, downsampled]
      properties:
        points:
          type: array
          description: 落在闭区间 [fromStep, toStep] 内的已持久化归档点，按 step 升序
          items:
            $ref: '#/components/schemas/SimulationState'
        availableFromStep:
          type: integer
          format: int64
          nullable: true
        availableToStep:
          type: integer
          format: int64
          nullable: true
        archiveSampleStride:
          type: integer
          format: int64
          description: 归档当前采样步长，不保证相邻点严格等距
        downsampled:
          type: boolean
          description: 超过 maxPoints 时均匀抽样并保留区间首尾，此时为 true
        currentState:
          $ref: '#/components/schemas/SimulationState'
          nullable: true
          description: 当前权威状态，运行中可能领先于归档点（最终一致）
    ReplayJobStatus:
      type: string
      enum: [QUEUED, RUNNING, COMPLETED, CANCELLED, FAILED]
    ReplaySource:
      type: string
      nullable: true
      enum: [CURRENT_STATE, ARCHIVE_EXACT, RECOMPUTED]
    ReplayJobCreateRequest:
      type: object
      required: [targetStep]
      properties:
        targetStep:
          type: integer
          format: int64
          minimum: 0
          description: 目标步，必须在 [0, currentStep] 内
    ReplayJob:
      type: object
      required:
        - jobId
        - experimentId
        - targetStep
        - status
        - progress
        - createdAt
        - updatedAt
        - expiresAt
      properties:
        jobId:
          type: string
          format: uuid
        experimentId:
          type: string
          format: uuid
        targetStep:
          type: integer
          format: int64
        status:
          $ref: '#/components/schemas/ReplayJobStatus'
        source:
          $ref: '#/components/schemas/ReplaySource'
        baseStep:
          type: integer
          format: int64
          nullable: true
          description: 重算起点；RECOMPUTED 时使用 floor 归档步或 0
        completedSteps:
          type: integer
          format: int64
        totalSteps:
          type: integer
          format: int64
        progress:
          type: number
          format: double
          minimum: 0
          maximum: 1
        result:
          $ref: '#/components/schemas/SimulationState'
          nullable: true
        error:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
          description: 完成/取消结果在内存中的保留截止时间
    ApiError:
      type: object
      required: [code, message, timestamp]
      properties:
        code:
          type: string
          enum:
            - VALIDATION_FAILED
            - INVALID_RETRY_CONTEXT
            - EXPERIMENT_NOT_FOUND
            - ILLEGAL_STATE_TRANSITION
            - EXPERIMENT_NOT_EDITABLE
            - QUEUE_CONFLICT
            - UNSUPPORTED_ACTION_PAYLOAD
            - MALFORMED_REQUEST
            - STORAGE_FAILURE
            - REPLAY_QUEUE_FULL
            - REPLAY_JOB_NOT_FOUND
            - INTERNAL_ERROR
        message:
          type: string
        timestamp:
          type: string
          format: date-time
        issues:
          type: array
          nullable: true
          items:
            $ref: '#/components/schemas/ValidationIssue'
